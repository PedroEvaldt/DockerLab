worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Resolver DNS interno do Docker — nginx precisa saber onde perguntar
    # 127.0.0.11 é o DNS embutido do Docker; TTL curto pra pegar mudanças
    resolver 127.0.0.11 valid=10s;

    # Log em stdout/stderr — pra `docker compose logs nginx` funcionar
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Define o backend uma vez, reusa nas rotas
    upstream api_upstream {
        server api:8080;
    }

    server {
        listen 80;
        server_name _;

        # Encaminha tudo pra api
        location / {
            proxy_pass http://api_upstream;

            # Headers que a api precisa enxergar
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts razoáveis (padrão do nginx é 60s, ok)
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
